name: Verify installation-page artifact
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare local documentation and metadata artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare-site.py --output artifacts/site
      - name: Verify retained state and archive boundaries
        run: python tools/qualify-site-artifact.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-page-review
          path: artifacts/site
          if-no-files-found: error
          retention-days: 7
